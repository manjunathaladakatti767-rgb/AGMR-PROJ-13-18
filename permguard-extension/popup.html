<!DOCTYPE html>
<html>
<head>
  <title>PermGuard Action</title>
  <style>
    body {
      width: 300px;
      padding: 1.5rem;
      background: #0f172a;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h2 { margin: 0 0 0.5rem 0; color: #60a5fa; font-size: 1.25rem; }
    p { color: #94a3b8; font-size: 0.875rem; margin-bottom: 1.5rem; }
    .status {
      padding: 0.75rem;
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(148, 163, 184, 0.2);
      margin-bottom: 1rem;
      font-size: 0.875rem;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 6px;
      color: white;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #2563eb; }
    .logout { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h2>PermGuard</h2>
  <p>Real-time Browser Security</p>

  <div id="login-form">
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">
    <button id="login-btn">Login & Start Sync</button>
  </div>

  <div id="user-info" style="display: none;">
    <div class="status">
      Logged in as: <br>
      <strong id="user-name">...</strong>
    </div>
    <div style="color: #10b981; font-size: 0.75rem; text-align: center; margin-bottom: 1rem;">
      ● Active Protection Enabled
    </div>
    <button id="logout-btn" class="logout">Logout</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
